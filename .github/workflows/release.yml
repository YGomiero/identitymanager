name: Publish a validated version
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to publish (for example 1.0.1)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, mbstring
          tools: composer:v2
          coverage: none
      - name: Validate tag against manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 -c 'import os,re,xml.etree.ElementTree as E; v=os.environ["RELEASE_VERSION"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); assert E.parse("package/pkg_identitymanager.xml").findtext("version")==v'
      - run: composer install --working-dir=component/site --no-dev --prefer-dist --no-interaction
      - run: composer audit --working-dir=component/site --no-dev
      - run: php tests/run.php
      - run: python3 tools/build.py
      - run: python3 tools/validate.py
      - name: Create release (never replace existing assets)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "$RELEASE_VERSION" dist/* --verify-tag --title "Identity Manager $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
